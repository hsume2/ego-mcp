# ego-mcp as a long-lived MCP service over Streamable HTTP.
#
#   cp .env.example .env   # fill in tokens and the embedding server
#   mkdir -p data logs     # must exist and be owned by EGO_MCP_UID:EGO_MCP_GID
#   docker compose up -d --build
#
# The port is published only on the Docker bridge gateway (docker0,
# 172.17.0.1 by default), so it is reachable from this host and from
# containers, but not from the LAN. Clients connect to
# http://172.17.0.1:${EGO_MCP_HTTP_PORT}/mcp (or http://ego-mcp:8765/mcp from
# a container on the same compose network) with
# "Authorization: Bearer ${EGO_MCP_HTTP_TOKEN}".
#
# Several independent instances can share this file: give each its own env
# file with a distinct EGO_MCP_INSTANCE, port, token and data/log mounts, e.g.
#
#   docker compose --env-file instances/alice.env up -d --build
#   docker compose --env-file instances/bob.env up -d
#
# Each instance gets its own compose project and container (ego-mcp-<name>).
name: ego-mcp-${EGO_MCP_INSTANCE:-default}

services:
  ego-mcp:
    build: .
    # A deployer can pin a commit-tagged image per instance by passing a second
    # env file that sets EGO_MCP_IMAGE; a plain `up -d --build` uses ego-mcp:local.
    image: ${EGO_MCP_IMAGE:-ego-mcp:local}
    container_name: ego-mcp-${EGO_MCP_INSTANCE:-default}
    restart: unless-stopped
    user: "${EGO_MCP_UID:-1000}:${EGO_MCP_GID:-1000}"
    environment:
      EGO_MCP_TRANSPORT: streamable-http
      # All interfaces *inside* the container; host exposure is set by ports.
      EGO_MCP_HTTP_HOST: 0.0.0.0
      EGO_MCP_HTTP_PORT: 8765
      EGO_MCP_HTTP_PATH: ${EGO_MCP_HTTP_PATH:-/mcp}
      EGO_MCP_HTTP_TOKEN: ${EGO_MCP_HTTP_TOKEN:?set EGO_MCP_HTTP_TOKEN in .env}
      EGO_MCP_EMBEDDING_PROVIDER: ${EGO_MCP_EMBEDDING_PROVIDER:-openai}
      EGO_MCP_EMBEDDING_MODEL: ${EGO_MCP_EMBEDDING_MODEL:-bge-m3}
      EGO_MCP_EMBEDDING_BASE_URL: ${EGO_MCP_EMBEDDING_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EGO_MCP_COMPANION_NAME: ${EGO_MCP_COMPANION_NAME:-Master}
      EGO_MCP_TIMEZONE: ${EGO_MCP_TIMEZONE:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${EGO_MCP_DATA_MOUNT:-./data}:/data
      # Point at the directory the dashboard ingestor tails (it defaults to /tmp).
      - ${EGO_MCP_LOG_MOUNT:-./logs}:/logs
    ports:
      - "${EGO_MCP_HTTP_BIND:-172.17.0.1}:${EGO_MCP_HTTP_PORT:-8765}:8765"
